# DO-01 y DO-02 · Integración y despliegue continuos de Haitani
# - En cada push y pull request a dev, QA o main: instala, crea la base de datos y corre las pruebas.
# - En cada push a main con pruebas aprobadas: despliega en Render y revisa que el servicio responda.
name: CI/CD Haitani

on:
  push:
    branches: [dev, QA, main]
  pull_request:
    branches: [dev, QA, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haitani_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haitani_ci
      SESSION_SECRET: ci-only-${{ github.run_id }}
      PGSSLMODE: disable

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Crear las tablas de la base de prueba
        run: node database/init.js

      - name: Ejecutar las pruebas
        run: npm test

  despliegue:
    name: Despliegue a Render
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://rwq70fnfjj.onrender.com

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      HEALTH_URL: https://rwq70fnfjj.onrender.com/api/health

    steps:
      - name: Revisar que exista el deploy hook
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Pedir el despliegue a Render
        id: hook
        run: |
          respuesta=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL")
          deploy_id=$(echo "$respuesta" | sed -n 's/.*"id":"\(dep-[^"]*\)".*/\1/p')
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Despliegue solicitado: ${deploy_id:-sin id}"

      - name: Esperar a que el despliegue termine
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' && steps.hook.outputs.deploy_id != ''
        run: |
          id="${{ steps.hook.outputs.deploy_id }}"
          for i in $(seq 1 60); do
            estado=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" \
              | sed -n 's/.*"status":"\([a-z_]*\)".*/\1/p')
            echo "Intento $i: $estado"
            case "$estado" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::El despliegue terminó en '$estado'. Render mantiene la versión anterior en línea."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::El despliegue no terminó en 20 minutos."
          exit 1

      - name: Revisar la salud del servicio
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 60 "$HEALTH_URL" | grep -q '"ok":true'; then
              echo "El servicio responde correctamente."
              exit 0
            fi
            echo "Intento $i sin respuesta, se vuelve a intentar en 15 s"
            sleep 15
          done
          echo "::error::$HEALTH_URL no respondió con ok:true."
          exit 1