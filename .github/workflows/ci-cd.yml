# DO-01 · Integración continua de Haitani
# - En cada push y pull request a dev, QA o main: instala, crea la base de datos y corre las pruebas.
# - El despliegue (DO-02) lo hace Render con Auto-Deploy cuando llega un cambio a main.
name: CI/CD Haitani

on:
  push:
    branches: [dev, QA, main]
  pull_request:
    branches: [dev, QA, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haitani_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haitani_ci
      SESSION_SECRET: ci-only-${{ github.run_id }}
      PGSSLMODE: disable

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Crear las tablas de la base de prueba
        run: node database/init.js

      - name: Ejecutar las pruebas
        run: npm test
